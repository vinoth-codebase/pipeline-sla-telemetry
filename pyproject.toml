[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-sla-telemetry"
version = "1.0.0"
description = "Upstream data pipeline health & downstream business impact forecaster for Airflow/dbt ETL estates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinothkumar N", email = "vinothofficial14@gmail.com" }]
keywords = ["airflow", "duckdb", "observability", "sla", "weibull", "cusum", "lineage", "data-engineering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "plotly>=5.18",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "streamlit>=1.30",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]
viz = ["plotly>=5.18", "kaleido>=0.2.1"]

[project.scripts]
pipeline-sla = "pipeline_sla.cli:main"

[project.urls]
Homepage = "https://github.com/vinothkumar-n/pipeline-sla-telemetry"
Repository = "https://github.com/vinothkumar-n/pipeline-sla-telemetry"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline_sla = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=pipeline_sla --cov-report=term-missing --cov-report=xml --cov-fail-under=88"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/pipeline_sla"]
omit = ["*/dashboard/app.py", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]
